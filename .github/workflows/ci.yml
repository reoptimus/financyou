# Intégration continue FinancYou — étape 0.1 de la feuille de route.
#
# Deux travaux (« jobs ») :
#   - qualite  : lint (ruff), typage (mypy) et tests unitaires sur Python 3.11 et 3.12
#   - pipeline : test de fumée de bout en bout (~20 s) vérifiant les fichiers produits
#
# Règle : aucun `continue-on-error`. Un travail qui échoue doit faire échouer la CI.

name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

# Annule les exécutions obsolètes sur une même branche pour économiser les runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # On veut connaître le résultat des deux versions, pas seulement de la première
      # qui échoue.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Mise en cache des paquets pip, indexée sur les fichiers de dépendances.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Typage (mypy)
        run: mypy

      - name: Tests unitaires (pytest)
        run: |
          mkdir -p rapports
          python -m pytest tests/ -q \
            --junitxml=rapports/pytest-${{ matrix.python-version }}.xml

      - name: Publication du rapport de tests
        # Le rapport doit être publié même quand les tests échouent, sinon il est
        # impossible de savoir lesquels. `always()` ne masque pas l'échec du job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-python-${{ matrix.python-version }}
          path: rapports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error

  pipeline:
    name: Test de fumée bout en bout
    runs-on: ubuntu-latest
    # Inutile de dérouler la chaîne complète si le code ne compile même pas.
    needs: qualite

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Exécution du pipeline complet
        env:
          # Backend matplotlib sans affichage : le runner n'a pas de serveur X.
          MPLBACKEND: Agg
        run: python examples/complete_pipeline_with_files.py

      - name: Vérification des fichiers de sortie attendus
        run: |
          set -euo pipefail
          attendus="
          outputs/optimal_portfolio.json
          outputs/investment_report.html
          outputs/allocation_pie_chart.png
          outputs/efficient_frontier.png
          outputs/monte_carlo_histogram.png
          outputs/tax_impact_waterfall.png
          outputs/wealth_trajectories.png
          "
          manquants=0
          for fichier in $attendus; do
            if [ ! -s "$fichier" ]; then
              echo "::error::Fichier de sortie manquant ou vide : $fichier"
              manquants=$((manquants + 1))
            else
              echo "OK  $fichier ($(wc -c < "$fichier") octets)"
            fi
          done
          if [ "$manquants" -ne 0 ]; then
            echo "::error::$manquants fichier(s) de sortie absent(s) : le pipeline est cassé."
            exit 1
          fi

      - name: Contrôle de cohérence du portefeuille optimal
        run: |
          python - <<'PY'
          import json
          import sys

          with open("outputs/optimal_portfolio.json", encoding="utf-8") as fh:
              portefeuille = json.load(fh)

          # Le test de fumée ne fige pas les valeurs numériques (elles évoluent avec
          # les modèles) : il vérifie que la structure est complète et cohérente.
          champs = [
              "weights",
              "expected_return",
              "expected_volatility",
              "sharpe_ratio",
              "max_drawdown",
          ]
          manquants = [c for c in champs if c not in portefeuille]
          if manquants:
              sys.exit(f"Champs absents du portefeuille optimal : {manquants}")

          poids = portefeuille["weights"]
          if not poids:
              sys.exit("Le portefeuille optimal ne contient aucun poids d'actif.")

          somme = sum(poids.values())
          if abs(somme - 1.0) > 1e-6:
              sys.exit(f"La somme des poids vaut {somme!r} au lieu de 1.0.")

          if any(p < -1e-9 for p in poids.values()):
              sys.exit(f"Poids négatif détecté : {poids}")

          print("Portefeuille optimal cohérent :", json.dumps(poids, indent=2))
          PY

      - name: Publication des sorties du pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorties-pipeline
          path: outputs/
          if-no-files-found: error
