# Pile de developpement / deploiement FinancYou.
# Un seul Dockerfile existe desormais a la racine du depot : l'ancien
# web_ui/Dockerfile faisait double emploi et a ete supprime.
# La cle "version" est obsolete avec Docker Compose v2 et a ete retiree.

services:
  financyou-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: financyou:latest
    container_name: financyou-dashboard
    ports:
      - "8501:8501"
    volumes:
      # L'image tourne en non-root (UID/GID 10001) : le repertoire hote
      # ./outputs doit etre inscriptible par cet UID
      # (ex. `mkdir -p outputs && sudo chown 10001:10001 outputs`).
      - ./outputs:/app/outputs
      # Jeux de donnees d'exemple montes en lecture seule.
      - ./examples/input_files:/app/examples/input_files:ro
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    # Durcissement : interdiction d'acquerir de nouveaux privileges.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
