; Configuration mypy pour FinancYou (étape 0.1 : intégration continue et hygiène).
;
; Stratégie PROGRESSIVE : le typage strict n'est activé que sur les cinq modules
; métier de investment_calculator.modules.*, qui constituent le cœur de la
; chaîne de calcul et l'API publique. Le reste du dépôt est vérifié en mode
; permissif, pour pouvoir être durci module par module lors des étapes suivantes
; sans bloquer la CI aujourd'hui.

[mypy]
python_version = 3.11

; Périmètre analysé par un simple `mypy` sans argument (utilisé tel quel en CI).
files = investment_calculator, time_series_slicer, web_ui, tests

; Les dépendances scientifiques (numpy, pandas, scipy, matplotlib, streamlit)
; n'exposent pas toutes des stubs complets : on ne veut pas d'erreurs d'import.
ignore_missing_imports = True
follow_imports = silent

; Confort de lecture des rapports
show_error_codes = True
show_column_numbers = True
pretty = True
color_output = False

; Garde-fous génériques, peu coûteux et sans faux positifs notables
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True

; Exclusions : code historique gelé, code archivé et scripts de démonstration.
exclude = (?x)(
      ^legacy/
    | ^examples/
    | ^outputs/
    | ^build/
    | ^dist/
    | ^web_ui/archive/
  )

; --- Cœur métier : contrôle renforcé -----------------------------------------
; Ces cinq modules portent la logique de calcul ; on y exige des signatures
; complètes et on interdit les définitions implicitement non typées.
[mypy-investment_calculator.modules.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

; --- Reste de la bibliothèque : mode permissif (durcissement ultérieur) -------
[mypy-investment_calculator.stochastic_models.*]
check_untyped_defs = False

[mypy-time_series_slicer.*]
check_untyped_defs = False

; web_ui/ n'a pas d'__init__.py : mypy résout ses fichiers comme des modules de
; premier niveau, d'où le nom de section ci-dessous. L'ancien `web_ui/app.py` est
; devenu `web_ui/archive/app_simple.py` : ce répertoire archivé n'est plus
; maintenu, il est donc exclu de l'analyse (voir `exclude` ci-dessus) et la
; section `[mypy-app]` correspondante a été supprimée.
[mypy-app_enhanced]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

; --- Dépendances tierces sans stubs ------------------------------------------
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True
