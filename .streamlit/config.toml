# Thème de l'interface FinancYou : sobre, clair, bleu marine.
# Streamlit lit ce fichier depuis la racine du dépôt, en local comme sur
# Streamlit Community Cloud. La typographie et les détails de mise en page sont
# dans web_ui/theme.py.

[theme]
base = "light"
primaryColor = "#1E3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#16202E"
font = "sans serif"

[client]
# Masque le bouton « Deploy » et le menu développeur dans l'application.
toolbarMode = "minimal"

[theme.sidebar]
# Barre latérale marine ; les champs y gardent un fond légèrement éclairci.
backgroundColor = "#0F1F33"
secondaryBackgroundColor = "#1A2D45"
textColor = "#D6DEE8"
primaryColor = "#B08D57"
